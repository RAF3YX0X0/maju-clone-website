<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="maju-grad" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#2a6652" />
      <stop offset="60%" stop-color="#1c4839" />
      <stop offset="100%" stop-color="#112d23" />
    </radialGradient>
    <linearGradient id="m-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#D4F6EB" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Background disc -->
  <circle cx="64" cy="64" r="63" fill="url(#maju-grad)" stroke="#38856c" stroke-width="2"/>
  <!-- Inner subtle ring -->
  <circle cx="64" cy="64" r="56" fill="none" stroke="rgba(212, 246, 235, 0.25)" stroke-width="1.5" stroke-dasharray="2 3"/>
  <!-- MAJU Monogram: bold architectural M -->
  <g filter="url(#glow)">
    <path d="M 35 90 L 35 38 L 64 68 L 93 38 L 93 90" 
          fill="none" 
          stroke="url(#m-grad)" 
          stroke-width="10.5" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
  </g>
</svg>